name: Pillow compatibility validation
on:
  push:
    branches: [validation/pillow-13]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 40407c1c0f9d65c6746ee57ddf85524d523edf03
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test,medical,ocv]' 'scikit-learn>=1.5,<2' poetry==2.3.3
      - name: Verify installed Pillow branch
        run: |
          python - <<'PY'
          import sys
          import PIL
          expected = '12.' if sys.version_info[:2] == (3, 10) else '13.'
          print(f'Python {sys.version}; Pillow {PIL.__version__}')
          assert PIL.__version__.startswith(expected)
          PY
      - name: Verify lock and build wheel
        run: |
          poetry check --lock
          poetry build --format wheel
      - name: Test image and annotation operations
        run: >-
          python -m pytest -q
          tests/darwin/exporter/formats/export_mask_test.py
          tests/darwin/dataset/download_manager_test.py
          tests/darwin/dataset/dataset_utils_test.py
          tests/darwin/exporter/formats/export_coco_test.py
          tests/darwin/exporter/formats/export_pascalvoc_test.py
          tests/darwin/exporter/formats/export_yolo_test.py
          tests/darwin/exporter/formats/export_yolo_segmented_test.py
